title: Build a Temporal Cloud Control Plane
teaser: Build the platform, not the workflow. A CLI that generates specs, a reconciler
  that interprets them as Temporal workflows, and a paved road that ends with a developer's
  worker on Kubernetes.
description: |-
  Most Temporal training teaches you to write a Workflow. This one teaches you to
  **build the platform underneath it**.

  Over four hands-on challenges you build a control plane for Temporal Cloud: a CLI
  that asks four questions, a reconciler that turns the answers into real
  namespaces, identities and credentials, and a paved road where a developer
  declares a task queue in a decorator and the platform does everything else.

  The measure it is built against is the one OpenAI's platform team used: **time to
  first workflow**. They took it from one-to-two weeks down to a day. By the last
  challenge you are on the developer's side of that boundary, and you can see what
  the platform did for you and what it never asked you to know.

  ### What you'll do

  1. **Bootstrap by hand** — Write the Terraform module the platform will run, then
     run it yourself, once, to make the namespace the namespace-creator runs in.
  2. **Turn on the provisioner** — Deploy the control plane onto that namespace,
     then write the last ten lines of the workflow that provisions a namespace,
     mints a scoped identity and puts the credential in Vault -- never in the event
     history.
  3. **Turn on the control loop** — Same activities, new driver. Commit a spec and
     let an entity workflow converge. Then change something in the Cloud UI behind
     the platform's back and watch the drift timer catch you.
  4. **The paved road** — A decorator declares a task queue; the platform generates
     the config, templates the manifest and deploys the worker to Kubernetes, where
     the credential arrives through Vault's Kubernetes auth.

  ### What you'll leave with

  A working control plane you can read, and one sentence you can defend in a design
  review: *the workflow id is the resource identity, so Temporal's uniqueness
  constraint is your state lock.*
