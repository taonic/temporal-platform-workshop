# Self-paced: nothing here depends on an instructor being in the room, and no
# challenge depends on another student's resources.
#
# One Instruqt challenge, four labs. The prose lives in the portal, which
# personalises every command with the student's username, cohort and region --
# something an assignment file cannot do. This track is the sandbox and the
# pointer to it; see CLAUDE.md.
idle_timeout: 7200
timelimit: 28800
sandbox_preset: temporal-platform-workshop

lab_config:
  extend_ttl: 10800
  feedback_recap_enabled: true
  hideStopButton: true
  default_layout: AssignmentLeft
  default_layout_sidebar_size: 38
  loadingMessages:
    - Warming the terraform provider cache, so your first apply is not your first wait.
    - Building the worker image now, so challenge 4 is about deployment and not about docker.
    - Leasing you a slot. Namespace names are recyclable by design; ask us why.
    - Starting a Kubernetes cluster, so that the one you deploy to is a real kubelet.
    - Deliberately not starting a control plane. Making the namespace it runs on is challenge 1.
