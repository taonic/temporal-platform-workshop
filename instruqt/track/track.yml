# Self-paced: nothing here depends on an instructor being in the room, and no
# challenge depends on another student's resources.
idle_timeout: 7200
timelimit: 28800
sandbox_preset: temporal-platform-workshop

lab_config:
  extend_ttl: 10800
  feedback_recap_enabled: true
  hideStopButton: true
  default_layout: AssignmentLeft
  default_layout_sidebar_size: 38
  loadingMessages:
    - Warming the terraform provider cache, so your first apply is not your first wait.
    - Building the worker image now, so challenge 4 is about deployment and not about docker.
    - Leasing you a slot. Namespace names are recyclable by design; ask us why.
    - Starting a control plane. It will shortly provision the namespace it runs on.
    - Seeding Vault. The only credential in this sandbox lives there and nowhere else.
