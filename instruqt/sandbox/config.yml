name: Temporal Platform Workshop
slug: temporal-platform-workshop
description: >-
  Five-challenge platform-engineering sandbox: Go toolchain, uv + Python 3.12,
  Terraform with a warm temporalcloud provider cache, Vault, k3s (installed, not
  started), the managed worker image pre-built and pre-imported, and the platform
  control plane running against a dev server.

virtualmachines:
  - name: platform-workshop
    image: instruqt/docker-28-3
    shell: /bin/bash
    # A Go build, a uv sync, a Docker daemon, k3s, Vault, a Temporal dev server and
    # the platform worker all run at once. n1-standard-1 does not carry it.
    machine_type: n1-standard-4
    memory: 16384
    cpus: 4
    allow_external_ingress:
      - http
      - https
      - high-ports
    # k3s wants it, and challenge 4 is the whole reason k3s is here.
    nested_virtualization: true
    provision_ssl_certificate: true

    environment:
      LAB_REPO_URL: https://github.com/taonic/temporal-platform-workshop.git
      LAB_REPO_REF: main
      WORKSHOP_DIR: /workspace/platform

      # Where the platform's Terraform state lives. The local backend is the
      # fallback when this is unreachable -- see stateBackend in the spec.
      STATE_SERVICE_URL: https://temporal-workshop-tfstate.fly.dev

      # Lab material and live checkpoints. The setup script prints a per-student
      # link with the participant, view token and leased slot already in it.
      PORTAL_URL: https://temporal-workshop-portal.fly.dev

      # Dev-mode Vault for challenges 1 to 3. Challenge 4 switches the worker to
      # Kubernetes auth, which is the point of that challenge.
      # Vault is a pod on k3s here, reachable through the NodePort in
      # deploy/platform/vault.yaml. Nothing listens on 8200 on the host.
      VAULT_ADDR: http://127.0.0.1:30820
      VAULT_DEV_ROOT_TOKEN_ID: workshop-root

      # 0 downgrades the closing egress probes to warnings -- use it when the
      # preset build network is not the network the sandbox runs on.
      WORKSHOP_STRICT_EGRESS: "1"

    # Set as Instruqt secrets, never here:
    #   TEMPORAL_CLOUD_API_KEY   the platform's Developer-role service account key
    #   STATE_SHARED_SECRET      per-participant state tokens are derived from it
    #   PORTAL_LINK_CODE         opens the portal. Rotate it after a cohort and every
    #                            outstanding link dies at once -- which is exactly why
    #                            it is not the same value as STATE_SHARED_SECRET:
    #                            rotating that would break state auth mid-workshop
