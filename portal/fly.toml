# fly.toml app configuration file generated for temporal-workshop-portal on 2026-08-29T16:13:51+10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'temporal-workshop-portal'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  PORTAL_COHORT_SIZE = '15'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '1m0s'
    timeout = '10s'
    grace_period = '15s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
