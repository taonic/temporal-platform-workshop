[project]
name = "managed-worker"
version = "0.1.0"
description = "The worker the platform's paved road produces. Product-side code: it declares what it needs and the platform provides it."
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.9.0",
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
managed-worker = "platform_sdk.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_sdk", "workflows"]

[tool.pytest.ini_options]
testpaths = ["tests"]
