# Authentik — the workshop's SAML identity provider.
#
# It replaced an Okta developer tenant for one reason: Okta's user cap is lower
# than a cohort plus the cohorts before it, and identities are reused. Temporal
# Cloud's own limit is 300 users per account, so Temporal was never the constraint.
#
# The price, stated plainly: this is a TOTAL-OUTAGE DEPENDENCY. Down at 09:00 means
# nobody logs into Temporal Cloud and the workshop does not start. Hence no
# scale-to-zero, a real health check, and two machines' worth of care about the two
# pieces of state that cannot be rebuilt:
#
#   1. The SAML signing keypair. Injected as a secret, NOT generated by Authentik
#      on first boot -- Temporal's SSO config pins the certificate, and changing it
#      means another support ticket with weeks of lead time.
#   2. The database. Fly Managed Postgres, attached separately, holding every
#      student's registration. Restore from a backup once before the first cohort;
#      an untested backup is not a backup.
app = 'temporal-workshop-authentik'
primary_region = 'syd'

[build]
  image = 'ghcr.io/goauthentik/server:2024.10'

[env]
  AUTHENTIK_LISTEN__HTTP = '0.0.0.0:9000'
  # Off deliberately: no mail anywhere in this design. Nothing in the workshop
  # sends or reads email, and a misconfigured mailer is a startup failure.
  AUTHENTIK_EMAIL__HOST = ''
  # The GeoIP updater needs a licence key and outbound access to MaxMind, and
  # provides nothing a 4-hour workshop uses.
  AUTHENTIK_DISABLE_UPDATE_CHECK = 'true'
  AUTHENTIK_ERROR_REPORTING__ENABLED = 'false'

# server serves the UI, the API the portal calls, and the SAML endpoints.
# worker runs migrations and background tasks; it is not optional -- a deploy
# without it comes up with an un-migrated database and fails in confusing ways.
[processes]
  server = 'server'
  worker = 'worker'

[http_service]
  internal_port = 9000
  force_https = true
  processes = ['server']
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    # Authentik's own readiness probe: it reports healthy only once migrations
    # have run and the database is reachable, which is what we actually depend on.
    path = '/-/health/ready/'

[[vm]]
  processes = ['server']
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2

[[vm]]
  processes = ['worker']
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
