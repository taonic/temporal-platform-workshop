# fly.toml app configuration file generated for temporal-workshop-tfstate on 2026-08-28T23:06:08+10:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'temporal-workshop-tfstate'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  STATE_DIR = '/data'

[[mounts]]
  source = 'tfstate'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
